<!doctype html>
<!-- 3D organ models: BodyParts3D, (c) The Database Center for Life Science, licensed under CC Attribution-Share Alike 2.1 Japan (http://lifesciencedb.jp/bp3d/). The models were simplified, repositioned and packed for this page; the packed model data embedded below is shared under the same licence. -->
<html lang="tr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vücudumuzdaki Sistemler · 3B Kitap</title>
<style>
:root{color-scheme:light;--bg:#cfdad2;--panel:rgba(255,252,244,.92);--ink:#1f2a37;--mut:#6b7280;--line:rgba(60,50,30,.16);--acc:#d97706;--acc2:#2f6b58;--chip:#fff;--shadow:0 8px 30px rgba(20,30,20,.18)}
:root[data-theme=dark]{color-scheme:dark;--bg:#0f1722;--panel:rgba(20,28,41,.92);--ink:#e6edf7;--mut:#9fb0c8;--line:rgba(148,163,184,.22);--acc:#f59e0b;--acc2:#5fd0b0;--chip:#1b2636;--shadow:0 8px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
canvas{display:block;touch-action:none;cursor:grab}
#top{position:fixed;top:10px;left:12px;right:12px;direction:ltr;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
#unit{background:var(--panel);padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;box-shadow:var(--shadow)}
#langs{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:999px;box-shadow:var(--shadow)}
#langs button{border:0;background:transparent;color:var(--ink);padding:4px 10px;border-radius:999px;font-weight:700;cursor:pointer;font-size:13px}
#langs button.on{background:var(--acc);color:#fff}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.lbl{position:absolute;left:0;top:0;display:none;white-space:nowrap;font-size:13.5px;font-weight:700;color:var(--ink);will-change:transform}
.lbl i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px #fff}
.lbl span{position:absolute;left:8px;top:-11px;background:var(--panel);padding:1px 7px;border-radius:6px;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.dots .lbl:not(.on) span{display:none}
.lbl.on span{background:var(--acc);color:#fff;border-color:transparent}
[dir=rtl] .lbl span{left:auto;right:8px}
/* bottom bar */
#bar{direction:ltr;position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:6px;background:var(--panel);padding:6px 8px;border-radius:999px;box-shadow:var(--shadow);max-width:calc(100vw - 20px)}
#bar button{border:0;background:transparent;color:var(--ink);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;display:grid;place-items:center;flex:none}
#bar button:hover:not(:disabled){background:rgba(120,120,120,.16)}
#bar button:disabled{opacity:.3;cursor:default}
#bar button.off{opacity:.45;text-decoration:line-through}
#barTitle{min-width:150px;max-width:36vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px;font-weight:600}
#barTitle b{color:var(--acc);margin-inline-end:4px}
#stars{font-weight:700;color:var(--acc);padding:0 8px;white-space:nowrap}
.sep{width:1px;height:22px;background:var(--line)}
#menu,#layerpop{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:7;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:260px;max-width:92vw}
#layerpop{left:auto;right:calc(50% - 190px);transform:none;min-width:210px;padding:10px 12px}
#menu[hidden],#layerpop[hidden]{display:none}
.mi{display:block;width:100%;text-align:start;border:0;background:transparent;color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.mi:hover,.mi.on{background:rgba(217,119,6,.14)}
.mi b{color:var(--acc);margin-inline-end:6px}
#layerpop label{display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer}
#layerpop .btn{margin-top:6px;width:100%}
/* card */
#card{position:fixed;top:56px;right:12px;left:auto;width:320px;max-height:calc(100vh - 140px);overflow:auto;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:14px 14px 16px;z-index:5}
#card.shut{display:none}
#cardToggle{position:fixed;top:56px;inset-inline-end:12px;z-index:6;display:none}
#card h2{font-size:18px;margin:0 0 6px}
#card h3{font-size:15px;margin:12px 0 4px}
.chead{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.chead h2{flex:1}
.btn{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:6px 11px;cursor:pointer;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--acc)}
.btn.alt{background:var(--acc2);border-color:transparent;color:#fff;white-space:nowrap}
.btn.sm{padding:3px 9px;font-size:12px;margin-top:6px}
.btn.on{background:var(--acc);color:#fff;border-color:transparent}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.explore{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin:2px 0 8px}
.explore i{flex:1;height:6px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.explore i::after{content:"";position:absolute;inset:0;width:var(--p);background:var(--acc);border-radius:99px;transition:width .3s}
.ocard{background:rgba(120,120,120,.09);border-radius:12px;padding:10px 12px;margin-bottom:8px;min-height:64px}
.ocard h3{margin:0 0 3px;color:var(--acc)}
.ocard p{margin:0;font-size:15px;line-height:1.55}
.notes{background:rgba(217,119,6,.08);border-radius:12px;padding:8px 12px;margin:6px 0 8px}
.notes summary{cursor:pointer;font-weight:700;color:var(--acc)}
.notes ul{margin:6px 0 2px;padding-inline-start:18px}
.notes li{margin:5px 0;font-size:14.5px;line-height:1.5}
.mut{color:var(--mut)}
.status{font-size:14px;background:rgba(47,107,88,.12);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:6px 0;font-size:13px;align-items:center}
.row input{grid-column:1/-1;width:100%;accent-color:var(--acc)}
.chips{display:flex;gap:5px;margin:4px 0}
.chip{flex:1;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:3px 0;cursor:pointer;font-weight:700}
.chip:hover{background:var(--acc);color:#fff}
.legend{font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}
.ecg{width:100%;height:56px;background:rgba(0,0,0,.05);border-radius:8px;margin:6px 0}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:var(--p);background:#e0b200;transition:width .2s}
.qbox{border-top:1px solid var(--line);margin-top:12px;padding-top:4px}
.q{margin:8px 0}
.qt{margin:0 0 6px;font-weight:700;font-size:15px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:14px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.good{background:#16a34a;color:#fff;border-color:transparent}
.opt.bad{background:#dc2626;color:#fff;border-color:transparent;animation:sh .35s}
.ex{font-size:13px;color:var(--acc2);margin:6px 0 0}
.big{font-size:18px;font-weight:700}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-10px);background:#dc2626;color:#fff;padding:8px 16px;border-radius:99px;z-index:20;opacity:0;transition:.25s;font-weight:600}
.toast.ok{background:#16a34a}.toast.go{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){
 #card{top:auto;bottom:74px;left:8px;right:8px;width:auto;max-height:38vh;border-radius:16px}
 #top{top:6px}
 #unit{font-size:11px;padding:4px 9px}
 #bar{width:calc(100vw - 16px);gap:2px}
 #bar .sep{display:none}
 #bar button{width:32px;height:32px}
 #stars{padding:0 4px;font-size:13px}
 #barTitle{flex:1;min-width:0;max-width:none;font-size:13px}
 #layerpop{right:8px}
}
#credit{position:fixed;left:12px;bottom:6px;z-index:4;font-size:10.5px;color:var(--mut);opacity:.85;max-width:34vw;line-height:1.3}
#credit a{color:inherit}
@media(max-width:820px){#credit{display:none}}
#reader{position:fixed;inset:0;z-index:30;background:rgba(10,15,25,.55);display:grid;place-items:center;padding:12px}
#reader[hidden]{display:none}
.rd{background:var(--panel);color:var(--ink);border-radius:18px;max-width:780px;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.rdtop{display:flex;gap:8px;justify-content:flex-end;padding:10px 12px 0}
.rdtop button{border:1px solid var(--line);background:var(--chip);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer}
.rdtop button:disabled{opacity:.3}
#rdBody{overflow:auto;padding:6px 26px 26px;font-size:18px;line-height:1.75}
#rdBody h2{font-size:26px;line-height:1.3;margin:4px 0 12px}
#rdBody .rk{color:var(--acc);font-weight:700;font-size:14px}
#rdBody .ro{background:rgba(217,119,6,.12);border-inline-start:5px solid var(--acc);padding:10px 14px;border-radius:10px;margin:0 0 16px}
#rdBody p{margin:0 0 14px}
#rdBody b{color:var(--acc)}
#rdBody .tip{font-size:15.5px;color:var(--mut);background:rgba(120,120,120,.08);padding:6px 12px;border-radius:8px}
.pg{font-size:12px;background:rgba(217,119,6,.15);color:var(--acc);padding:1px 8px;border-radius:99px;margin-inline-start:6px;font-weight:700}
.mh{padding:8px 10px 2px;font-weight:800;color:var(--acc);font-size:13px}
.mh b{margin-inline-end:6px}
.mi.sub{padding:5px 10px 5px 26px;font-size:13.5px}
[dir=rtl] .mi.sub{padding:5px 26px 5px 10px}
#menu{max-height:62vh;overflow:auto}
.readbox{background:rgba(217,119,6,.10);border-radius:12px;padding:10px 12px;margin:6px 0 8px}
.readbox .rh{font-weight:800;font-size:15.5px;margin-bottom:4px}
.readbox .ro2{margin:0 0 8px;font-size:14.5px;line-height:1.55}
details.dt{border-top:1px solid var(--line);padding:8px 0}
details.dt summary{cursor:pointer;font-weight:800;color:var(--acc);font-size:14.5px}
.vocab{max-height:260px;overflow:auto;margin-top:6px}
.vrow{padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.vrow.key b{color:var(--acc)}
.vrow small{display:block;color:var(--mut);font-size:12px}
.opts.col{flex-direction:column}
.opts.col .opt{text-align:start;width:100%}
.op{font-size:13.5px;margin:8px 0;line-height:1.55}
.chip.on{background:var(--acc);color:#fff}
.chip.got1{padding:3px 8px;font-weight:600;flex:none}
.mchips{margin:2px 0 8px}
.ans{width:100%;margin-top:4px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:6px 8px;font:inherit;font-size:13.5px;resize:vertical}
.thumb{display:block;max-width:100%;max-height:140px;border-radius:8px;margin-top:6px}
.op label.btn{display:inline-block;margin-top:6px;cursor:pointer}
.op input.photo{display:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<div id="top"><div id="unit"></div><button id="cardBtn" class="btn" aria-label="info">ⓘ</button><div id="langs"></div></div>
<aside id="card"></aside>
<div id="menu" hidden></div>
<div id="layerpop" hidden>
 <label id="lp-labels"><input type="checkbox"><span></span></label>
 <label id="lp-outline"><input type="checkbox" checked><span></span></label>
 <label id="lp-rotate"><input type="checkbox"><span></span></label>
 <button class="btn" id="lp-reset"></button>
</div>
<div id="bar">
 <button id="menuBtn" aria-label="menu">☰</button>
 <button id="readBtn" aria-label="read">📖</button>
 <button id="prev" aria-label="previous">‹</button>
 <div id="barTitle"></div>
 <button id="next" aria-label="next">›</button>
 <span class="sep"></span>
 <span id="stars">★ 0</span>
 <span class="sep"></span>
 <button id="sound" aria-label="sound">🔊</button>
 <button id="theme" aria-label="theme">◐</button>
 <button id="layers" aria-label="layers">◫</button>
</div>
<div id="reader" hidden><div class="rd"><div class="rdtop"><button id="rdPrev" aria-label="previous">‹</button><button id="rdNext" aria-label="next">›</button><button id="rdClose" aria-label="close">✕</button></div><div id="rdBody"></div></div></div>
<div id="credit"><a href="http://lifesciencedb.jp/bp3d/" target="_blank" rel="noopener">BodyParts3D</a> © The Database Center for Life Science · <a href="https://creativecommons.org/licenses/by-sa/2.1/jp/deed.en" target="_blank" rel="noopener">CC BY-SA 2.1 JP</a> · modified (simplified, repositioned)</div>
<span id="hint" hidden></span>
<script>/*THREE*/</script>
<script>/*ORBIT*/</script>
<script>
/*APP*/
</script>
</body>
</html>
